name: GPU tests and benchmarks

# Runs on a self-hosted runner attached to a GPU host that OTHER PEOPLE SHARE. Two things follow
# from that, and neither is optional.
#
# Security. This repository is public, so without gating, anyone could fork it, edit a file this
# workflow executes, open a pull request, and run arbitrary code on the host. Fork PRs cannot alter
# the workflow file itself — that is read from the base branch — but they fully control the sources
# it runs and the packages it instantiates. Two independent controls prevent this:
#
#   1. Repo setting: "Require approval for all external contributors" (NOT the public-repo default
#      of first-time contributors, which is too weak).
#   2. The `if:` gate on every job below — a fork PR never even queues.
#
# Both are load-bearing. Removing either re-opens arbitrary code execution on the box.
#
# Courtesy. Other people's jobs live on this machine. Every job asks `gpu_preflight.sh` whether
# devices are genuinely free before claiming any, waits — holding nothing — until they are, pins
# itself to the subset it was granted, caps its device memory, and runs niced. It never takes a GPU
# someone else is on and never interrupts a running job. If the wait runs out, the job stands down
# and says so out loud; see the note on skip visibility below.
#
# Scratch files go in $RUNNER_TEMP, not /tmp: the host is shared, and a predictable /tmp path is
# something another user can clobber or pre-empt with a symlink.

on:
  pull_request:
  # main itself is worth testing on real devices, not just pull requests — `concurrency` below
  # already serialises everything through the single runner.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Run benchmarks even if the host looks busy (skips the load gate)"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

# One runner, one GPU host, so jobs must never overlap. Two concurrent runs would contend for the
# same devices, and the allocation regression testset reads a counter that is global to its Julia
# process — a second benchmark process running beside it would not corrupt that, but two runs
# fighting over the same GPUs would make every timing meaningless.
#
# `cancel-in-progress: false` because a running job holds real devices; killing it mid-kernel buys
# nothing. Superseded *waiting* jobs are handled differently — see the supersession hook below.
concurrency:
  group: gpu-sasquatch
  cancel-in-progress: false

env:
  # The host is shared and MDLA sizes its pool against whatever is free, so an uncapped run is the
  # one way this workflow can hurt a co-tenant that arrives after it started. A30s have 24 GiB.
  JULIA_CUDA_HARD_MEMORY_LIMIT: "16GiB"
  # How long a job will wait for the host to free up before standing down. Waiting costs another
  # user nothing — it only re-reads nvidia-smi — and the alternative is that a busy week means no
  # pull request ever gets GPU coverage at all.
  GPU_WAIT_SECONDS: "7200"
  GPU_POLL_SECONDS: "120"

jobs:
  # ── Correctness ────────────────────────────────────────────────────────────
  # Cheap, short, and the reason this runner exists: the GPU half of the suite has never been able
  # to run in CI. Only 2 devices and no load gate — correctness does not care how noisy the host is.
  #
  # `--prefer-far` asks for the WORST-connected free pair, the opposite of what the benchmark job
  # wants. `test/test_cross_socket.jl` covers the SYS-class links that a mistranslating IOMMU
  # corrupts hardest and that `_p2p_copy_ok`'s host-staging fallback exists to protect; handed a
  # well-connected pair, `_far_device_pair()` reports `cross_numa = false` and that file silently
  # degrades to re-testing an adjacent pair.
  test-gpu:
    name: GPU test suite
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, cuda]
    # Covers the preflight wait (GPU_WAIT_SECONDS) plus the suite itself.
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      # No julia-actions/cache here: the runner is persistent, so ~/.julia already survives between
      # runs. The action would only add a large upload and download on top of it.

      - name: Build supersession hook
        id: hook
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A waiting job can sit on the queue for up to two hours, and `cancel-in-progress: false`
          # means a second push does not cancel it — without this it would eventually run the suite
          # against a stale commit while the newer run waited behind it. gpu_preflight.sh calls this
          # once per poll and abandons the wait (exit 4) when it fails.
          #
          # git ls-remote rather than the REST API: no jq or gh dependency on the host, and
          # actions/checkout has already configured an authenticated origin. Fork PRs never reach
          # this job, so the head branch is always in origin.
          cat > "$RUNNER_TEMP/not-superseded.sh" <<'EOF'
          #!/usr/bin/env bash
          live=$(git ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)
          # Branch deleted, or the network hiccuped: keep waiting rather than guess. A wrong
          # "superseded" verdict silently drops the only GPU coverage this PR would ever get.
          [ -n "$live" ] || exit 0
          [ "$live" = "${HEAD_SHA}" ]
          EOF
          chmod +x "$RUNNER_TEMP/not-superseded.sh"
          echo "path=$RUNNER_TEMP/not-superseded.sh" >> "$GITHUB_OUTPUT"

      - name: Preflight — wait for 2 free GPUs on distant sockets
        id: pf
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          HOOK=()
          if [ -n "${{ steps.hook.outputs.path }}" ]; then
            HOOK=(--wait-hook "${{ steps.hook.outputs.path }}")
          fi
          REASON=$(./benchmark/gpu_preflight.sh \
            --need 2 --prefer-far \
            --wait "$GPU_WAIT_SECONDS" --poll "$GPU_POLL_SECONDS" \
            "${HOOK[@]}" --bare 2>&1 >"$RUNNER_TEMP/devs")
          RC=$?
          set -e
          echo "$REASON"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "devices=$(cat "$RUNNER_TEMP/devs")" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "rc=$RC" >> "$GITHUB_OUTPUT"
            # Only the last line: the wait loop logs one line per poll.
            echo "reason=$(echo "$REASON" | tail -n1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run test suite
        if: steps.pf.outputs.ok == 'true'
        env:
          CUDA_VISIBLE_DEVICES: ${{ steps.pf.outputs.devices }}
          JULIA_NUM_THREADS: "4"
        run: nice -n 19 julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Report stand-down
        if: steps.pf.outputs.ok != 'true'
        run: |
          # Exit 4 is "a newer commit superseded this run" — an orderly handover, not a stand-down,
          # and not worth a warning annotation on a run nobody is waiting for.
          if [ "${{ steps.pf.outputs.rc }}" = "4" ]; then
            echo "Yielded the GPU host to a newer run on this pull request."
          else
            echo "::warning title=GPU tests skipped::${{ steps.pf.outputs.reason }}"
            echo "The shared GPU host had no free devices for the whole wait window."
            echo "This is a stand-down, not a pass."
          fi

  # ── Performance ────────────────────────────────────────────────────────────
  # Attempts on every PR, but only proceeds when there is genuinely room: 4 free devices AND a host
  # not already loaded. With P2P degraded the halo exchange stages through host memory, so CPU
  # contention lands directly on what we are trying to measure — a number taken on a loaded host is
  # not worth posting. Unlike the test job this wants the BEST-connected set, which is the default.
  benchmark-gpu:
    name: GPU benchmarks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: test-gpu
    runs-on: [self-hosted, cuda]
    # Covers the preflight wait (GPU_WAIT_SECONDS) plus the benchmark run.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"

      - name: Build supersession hook
        id: hook
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cat > "$RUNNER_TEMP/not-superseded.sh" <<'EOF'
          #!/usr/bin/env bash
          live=$(git ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)
          [ -n "$live" ] || exit 0
          [ "$live" = "${HEAD_SHA}" ]
          EOF
          chmod +x "$RUNNER_TEMP/not-superseded.sh"
          echo "path=$RUNNER_TEMP/not-superseded.sh" >> "$GITHUB_OUTPUT"

      - name: Preflight — wait for 4 free GPUs and a quiet host
        id: pf
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          HOOK=()
          if [ -n "${{ steps.hook.outputs.path }}" ]; then
            HOOK=(--wait-hook "${{ steps.hook.outputs.path }}")
          fi
          LOAD_GATE=(--max-load-frac 0.6)
          if [ "${{ inputs.force }}" = "true" ]; then
            LOAD_GATE=()
          fi
          REASON=$(./benchmark/gpu_preflight.sh \
            --need 4 "${LOAD_GATE[@]}" \
            --wait "$GPU_WAIT_SECONDS" --poll "$GPU_POLL_SECONDS" \
            "${HOOK[@]}" --bare 2>&1 >"$RUNNER_TEMP/devs")
          RC=$?
          set -e
          echo "$REASON"
          if [ "$RC" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "devices=$(cat "$RUNNER_TEMP/devs")" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "rc=$RC" >> "$GITHUB_OUTPUT"
            echo "reason=$(echo "$REASON" | tail -n1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Instantiate benchmark environment
        if: steps.pf.outputs.ok == 'true'
        run: julia --project=benchmark -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'

      - name: Run benchmarks under the contention watchdog
        if: steps.pf.outputs.ok == 'true'
        env:
          CUDA_VISIBLE_DEVICES: ${{ steps.pf.outputs.devices }}
          JULIA_NUM_THREADS: "4"
          # 1000² is the first size CI has run unattended. gpu.jl defaults to 500²; §3–§5 are
          # communication-bound below ~1500². Raise once a real run reports its wall-clock — the
          # host-side SparseMatrixCSC assembly is what grows fastest, and that RAM is shared.
          POISSON_NX: "1000"
        run: |
          ./benchmark/gpu_watchdog.sh start --devices "$CUDA_VISIBLE_DEVICES" --log "$RUNNER_TEMP/wd.log"
          nice -n 19 julia --project=benchmark benchmark/gpu.jl 2>&1 | tee "$RUNNER_TEMP/gpu-bench.txt"
          RC=${PIPESTATUS[0]}
          ./benchmark/gpu_watchdog.sh stop --log "$RUNNER_TEMP/wd.log"
          # Non-fatal: a contended run still produced numbers, they just must not be trusted.
          # Deliberately does not abort mid-run — see gpu_watchdog.sh. `check` writes its verdict to
          # the log we fold into the PR comment below.
          ./benchmark/gpu_watchdog.sh check --log "$RUNNER_TEMP/wd.log" \
              --devices "$CUDA_VISIBLE_DEVICES" 2>"$RUNNER_TEMP/wd-verdict.txt" || true
          exit "$RC"

      - name: Build PR comment
        if: always() && github.event_name == 'pull_request' && steps.pf.outputs.rc != '4'
        run: |
          {
            echo '### GPU benchmark results'
            echo ''
            if [ "${{ steps.pf.outputs.ok }}" != "true" ]; then
              # A silently absent table is exactly how a device-blind CPU table got mistaken for
              # "the optimisation did nothing" on #26. Never let a skip look like a result.
              echo '> **Stood down — these benchmarks did NOT run.**'
              echo '>'
              echo "> \`${{ steps.pf.outputs.reason }}\`"
              echo '>'
              echo '> The GPU host is shared and stayed busy for the whole wait window, so no'
              echo '> devices were ever claimed. This is not a performance statement: no'
              echo '> measurement was taken. Re-run via *Actions → GPU tests and benchmarks →'
              echo '> Run workflow* when the host is quiet, or with **force** to skip the load gate.'
            else
              echo "Devices \`${{ steps.pf.outputs.devices }}\` on the shared GPU host, niced, 1000² grid."
              echo ''
              echo '```'
              cat "$RUNNER_TEMP/wd-verdict.txt" 2>/dev/null || true
              echo '```'
              echo ''
              echo '<details><summary>Full output</summary>'
              echo ''
              echo '```'
              cat "$RUNNER_TEMP/gpu-bench.txt"
              echo '```'
              echo ''
              echo '</details>'
            fi
          } > "$RUNNER_TEMP/body.md"

      - name: Find existing comment
        if: always() && github.event_name == 'pull_request' && steps.pf.outputs.rc != '4'
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: GPU benchmark results

      - name: Post results
        if: always() && github.event_name == 'pull_request' && steps.pf.outputs.rc != '4'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ runner.temp }}/body.md
          edit-mode: replace
